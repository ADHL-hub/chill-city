<style>
  /* Chill City 夜生活城 · 3D 小样本

  html, body { margin: 0; height: 100%; overflow: hidden; background: #07071a; font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #ui { position: fixed; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #place { background: rgba(10,8,30,.75); color: #fff; font-size: 18px; font-weight: bold; padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.15); }
  #langs { display: flex; gap: 4px; pointer-events: auto; }
  #langs button { font-size: 15px; padding: 6px 11px; border: 0; border-radius: 6px; background: rgba(10,8,30,.75); color: #fff; cursor: pointer; }
  #langs button.on { background: #ffd400; color: #000; }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(10,8,30,.8); color: #eee; font-size: 14px; padding: 8px 14px; border-radius: 16px; width: max-content; max-width: 88vw; text-align: center; line-height: 1.4; pointer-events: none; transition: opacity .6s; }
  #toast { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.85); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 16px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #music { position: fixed; top: 10px; right: 12px; width: 46px; height: 46px; border-radius: 50%; border: 0; font-size: 22px; background: rgba(10,8,30,.8); color: #fff; cursor: pointer; }
  #mapBtn { position: fixed; top: 64px; right: 12px; width: 46px; height: 46px; border-radius: 50%; border: 0; font-size: 22px; background: rgba(10,8,30,.8); color: #fff; cursor: pointer; }
  #mapPanel { z-index: 5; position: fixed; top: 226px; right: 12px; background: rgba(10,8,30,.92); border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 8px; display: none; flex-direction: column; gap: 4px; max-height: 70vh; overflow-y: auto; }
  #mapPanel button { text-align: left; font-size: 15px; padding: 9px 12px; border: 0; border-radius: 8px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer; white-space: nowrap; }
  #mapPanel button:disabled { opacity: .4; cursor: default; }
  #statusBtn { position: fixed; top: 118px; right: 12px; width: 46px; height: 46px; border-radius: 50%; border: 0; font-size: 22px; background: rgba(10,8,30,.8); color: #fff; cursor: pointer; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .card { background: #fffaf0; color: #222; border: 4px solid #3b3355; border-radius: 14px; padding: 16px; width: min(360px, 92vw); max-height: 86vh; overflow-y: auto; box-sizing: border-box; }
  .card-top { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid #3b3355; flex: none; background: #ddd; }
  .card-name { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
  .card-tag { font-size: 13px; }
  .card-tag.npc { color: #888; } .card-tag.real { color: #2a7a2a; } .card-tag.me { color: #b8860b; }
  .card-status { display: inline-block; margin-top: 6px; background: #ffe88a; color: #3b3355; border-radius: 10px; padding: 2px 10px; font-size: 14px; }
  .card-bio { font-size: 16px; margin: 8px 0; }
  .card-line { font-size: 14px; color: #555; margin: 4px 0; }
  .card-label { font-size: 13px; color: #666; margin: 10px 0 3px; }
  .card-note { font-size: 12px; color: #888; margin-top: 10px; }
  .card-err { color: #d63031; font-size: 14px; min-height: 18px; }
  .card-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .btn { flex: 1; min-height: 44px; border: 0; border-radius: 8px; color: #fff; background: #6c5ce7; font-size: 15px; padding: 8px; cursor: pointer; }
  .btn.dark { background: #3b3355; } .btn:disabled { opacity: .4; }
  .field { width: 100%; box-sizing: border-box; font-size: 16px; padding: 9px; border: 2px solid #bbb; border-radius: 8px; font-family: inherit; }
  textarea.field { min-height: 64px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip { border: 2px solid #3b3355; background: #fff; border-radius: 16px; padding: 6px 10px; font-size: 14px; cursor: pointer; }
  .photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .photo { position: relative; flex: 1; aspect-ratio: 1; }
  .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; cursor: pointer; }
  .del { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; cursor: pointer; }
  img.big { width: 100%; border-radius: 10px; margin-bottom: 8px; }
  #friendsBtn { position: fixed; top: 172px; right: 12px; width: 46px; height: 46px; border-radius: 50%; border: 0; font-size: 22px; background: rgba(10,8,30,.8); color: #fff; cursor: pointer; }
  #friendsBadge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: #ff3c3c; color: #fff; font-size: 12px; line-height: 18px; display: none; }
  .avatar.small { width: 56px; height: 56px; } .avatar.tiny { width: 44px; height: 44px; }
  .msgs { height: min(300px, 45vh); overflow-y: auto; background: #f1ece0; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 15px; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: #6c5ce7; color: #fff; }
  .msg.them { align-self: flex-start; background: #fff; border: 1px solid #ddd; }
  .friend-row { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; cursor: pointer; }
  .friend-row:hover { background: #f1ece0; }
  .friend-mid { flex: 1; min-width: 0; }
  .friend-name { font-weight: bold; }
  .friend-last { font-size: 13px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread { min-width: 22px; height: 22px; border-radius: 11px; background: #ff3c3c; color: #fff; font-size: 13px; text-align: center; line-height: 22px; }
  .locked { margin-top: 10px; padding: 14px; border: 2px dashed #bbb; border-radius: 10px; text-align: center; color: #777; font-size: 14px; }
  #rot { position: fixed; right: 12px; bottom: 60px; display: flex; gap: 8px; }
  #rot button { width: 48px; height: 48px; border-radius: 50%; border: 0; font-size: 22px; background: rgba(10,8,30,.8); color: #fff; cursor: pointer; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #bbb; cursor: pointer; }
  .swatch.on { box-shadow: 0 0 0 3px #3b3355; }
  .chip.on { background: #3b3355; color: #fff; }
  .adult { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 15px; }
  .adult input { width: 22px; height: 22px; }
  .link { display: block; margin: 10px auto 0; background: none; border: 0; color: #6c5ce7; font-size: 15px; text-decoration: underline; cursor: pointer; }
  .gap { height: 8px; }
  .auth-langs { display: flex; gap: 6px; justify-content: flex-end; margin: -4px 0 4px; }
  .auth-langs .chip { padding: 4px 12px; }
  .btn.google { width: 100%; background: #fff; color: #333; border: 2px solid #ddd; font-weight: bold; margin: 6px 0 2px; }
  .or { text-align: center; color: #999; font-size: 13px; margin: 8px 0; }
  #lineBtn { display: none; pointer-events: auto; align-self: flex-start; font-size: 14px; padding: 6px 11px; border: 0; border-radius: 6px; background: rgba(10,8,30,.75); color: #fff; cursor: pointer; }
  body.online #lineBtn { display: block; }
  .where { font-size: 12px; color: #2a7a2a; }
  .line-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
  #chatBar { position: fixed; left: 10px; bottom: 12px; display: none; gap: 6px; width: min(440px, calc(100vw - 140px)); }
  #chatBar input { flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px; border-radius: 22px; border: 0; background: rgba(255,255,255,.92); }
  #chatBar button { border: 0; border-radius: 22px; padding: 0 16px; font-size: 15px; background: #6c5ce7; color: #fff; cursor: pointer; }
  body.online #hint { bottom: 66px; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px; }

// 用画布写字，变成 3D 里的招牌或名牌
function textTexture(text, o) {
  o = o || {};
  const size = o.size || 64, pad = o.pad || 20;
  const font = `bold ${size}px Arial, "PingFang SC", "Microsoft YaHei", sans-serif`;
  const c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = font;
  const w = Math.ceil(x.measureText(text).width) + pad * 2, h = Math.ceil(size * 1.5) + pad;
  c.width = w; c.height = h;
  x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  if (o.bg) {
    x.fillStyle = o.bg;
    const r = h / 2.2;
    x.beginPath(); x.moveTo(r, 0); x.arcTo(w, 0, w, h, r); x.arcTo(w, h, 0, h, r); x.arcTo(0, h, 0, 0, r); x.arcTo(0, 0, w, 0, r); x.fill();
  }
  if (o.glow) { x.shadowColor = o.glow; x.shadowBlur = size * 0.5; }
  x.fillStyle = o.color || '#fff';
  x.fillText(text, w / 2, h / 2 + 2);
  if (o.glow) { x.shadowBlur = size * 0.2; x.fillText(text, w / 2, h / 2 + 2); }
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 4;
  return { tex, aspect: w / h };
}
// 永远面向镜头的文字（名字、对话）
function label(text, height, o) {

  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, toneMapped: false }));
  s.scale.set(height * aspect, height, 1);
  s.renderOrder = 10;
  return s;
}

  const { tex, aspect } = textTexture(text, { color: '#fff', glow: color, size: 72, pad: 40 });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, width / aspect),

}

function makePerson(o) {
  const g = new THREE.Group();
  const skin = lambert(o.skin), shirt = lambert(o.shirt), pants = lambert(o.pants), hair = lambert(o.hair);

    const pivot = new THREE.Group();
    pivot.position.set(px, py, 0);
    const m = box(w, h, d, mat, 0, -h / 2, 0);
    pivot.add(m);
    g.add(pivot);
    return pivot;
  };
  g.rotation.order = 'YXZ'; // 先转方向，再前后倒（躺椅、床用得到）
  const legMat = o.dress ? skin : pants;

  if (o.dress) { // 裙子
    const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.36, 0.42, 14), shirt);
    skirt.position.y = 0.43;
    g.add(skirt);
  }
  g.add(box(0.5, 0.52, 0.32, shirt, 0, 0.76, 0));
  g.armL = limb(0.13, 0.45, 0.15, shirt, -0.33, 1.0);
  g.armR = limb(0.13, 0.45, 0.15, shirt, 0.33, 1.0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 18, 14), skin);
  head.position.y = 1.32;
  g.add(head);
  const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.36, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2.1), hair);
  hairCap.position.y = 1.35;
  hairCap.rotation.x = -0.25;
  g.add(hairCap);
  if (o.longHair) g.add(box(0.6, 0.55, 0.18, hair, 0, 1.12, -0.2));
  const eye = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
  [-0.11, 0.11].forEach((ex) => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), eye);
    e.position.set(ex, 1.32, 0.31);
    g.add(e);
  });
  // 脚下的影子
  const sh = new THREE.Mesh(new THREE.CircleGeometry(0.42, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
  sh.rotation.x = -Math.PI / 2;
  sh.position.y = 0.02;
  g.add(sh);
  // 名字
  g.nameTag = label((o.isNpc ? '🤖 ' : '') + o.name, 0.32, { color: o.isNpc ? '#d6d6d6' : '#ffffff', bg: 'rgba(0,0,0,.55)', size: 40, pad: 14 });
  g.nameTag.position.y = 2.0;
  g.add(g.nameTag);
  // 隐形的大圆柱：手机比较容易点到人
  const hitP = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.9, 8), new THREE.MeshBasicMaterial({ visible: false }));
  hitP.position.y = 0.95;
  g.add(hitP);
  g.traverse((m) => { m.userData.person = g; });
  g.look = o;
  g.isNpc = o.isNpc;
  g.speed = o.speed || 3.5;
  g.target = null;

}

function makeSeat(A, style, color, x, z, rot) {
  const g = new THREE.Group();
  const m = lambert(color);
  let h;
  if (style === 'chair') {
    g.add(box(0.62, 0.1, 0.6, m, 0, 0.45, 0));
    g.add(box(0.62, 0.7, 0.1, m, 0, 0.85, -0.26));
    [[-0.26, -0.24], [0.26, -0.24], [-0.26, 0.24], [0.26, 0.24]].forEach(([lx, lz]) => g.add(box(0.06, 0.45, 0.06, lambert(0x222222), lx, 0.22, lz)));
    h = 0.5;
  } else if (style === 'stool') {
    g.add(cyl(0.26, 0.26, 0.08, m, 0, 0.72, 0, 14));
    g.add(cyl(0.05, 0.05, 0.7, lambert(0x888888), 0, 0.35, 0, 6));
    g.add(cyl(0.22, 0.22, 0.03, lambert(0x888888), 0, 0.02, 0, 12));
    h = 0.76;
  } else if (style === 'plastic') {
    g.add(cyl(0.24, 0.2, 0.45, m, 0, 0.22, 0, 12));
    h = 0.45;
  } else {
    g.add(box(0.95, 0.42, 0.75, m, 0, 0.21, 0));
    g.add(box(0.95, 0.65, 0.16, m, 0, 0.6, -0.3));
    h = 0.44;
  }
  // 隐形的大一点的盒子：手机比较容易点到椅子
  const hit = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.2, 0.95), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.y = 0.6;
  g.add(hit);
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  A.scene.add(g);
  const seat = { x, z, rot, h, occupant: null };
  g.traverse((o) => { o.userData.seat = seat; });
  A.seatMeshes.push(g);
  A.seats.push(seat);
  return seat;
}
// 一排椅子：从 (x1,z1) 排到 (x2,z2)，共 n 张，全部面向 rot
function seatRow(A, style, color, x1, z1, x2, z2, n, rot) {
  for (let i = 0; i < n; i++) {
    const k = n === 1 ? 0 : i / (n - 1);
    makeSeat(A, style, color, x1 + (x2 - x1) * k, z1 + (z2 - z1) * k, rot);
  }
}

const Music = (() => {

  const rnd = (a) => a[Math.floor(Math.random() * a.length)];

    if (!ac) {

      master.connect(ac.destination);

    out.connect(g); g.connect(master);
    const hold = t + Math.max(attack, dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.setValueAtTime(vol, hold);

    } },
    mart: { bpm: 118, play(s, t, d, bar) { // 便利店：轻快的小调子
      const ch = [[60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]][bar % 4];
      if (s === 0 || s === 8) ch.forEach((n) => tone(n, t, d * 6, 'triangle', 0.035, 0.01, 0.3));
      if (s % 4 === 0) tone(ch[0] - 24, t, d * 2, 'sine', 0.12, 0.01, 0.1);
      if (s % 2 === 0) { const mel = [72, 76, 79, 76, 74, 77, 79, 84]; if (Math.random() < 0.75) tone(mel[(s / 2 + bar) % 8], t, d * 1.2, 'square', 0.02, 0.002, 0.1, 2500); }
      if (s % 4 === 2) hat(t, 0.04);
    } },
    lucky: { bpm: 112, play(s, t, d, bar) { // 热闹
      if (s % 2 === 0 && Math.random() < 0.7) tone(rnd([60, 62, 64, 67, 69, 72, 74, 76]) + 12, t, d * 1.5, 'square', 0.022, 0.002, 0.15, 2500);
      if (s % 4 === 0) kick(t, 0.45);
      if (s % 4 === 2) hat(t, 0.06);
      if (s === 0) [48, 55, 60].forEach((n) => tone(n, t, d * 14, 'triangle', 0.04, 0.05, 0.5));
    } },
  };

  function schedule() {
    if (!ac || !style || !enabled) return;
    const d = 60 / style.bpm / 4;
    while (next < ac.currentTime + 0.15) {
      if (next < ac.currentTime) next = ac.currentTime + 0.02;
      try { style.play(step % 16, next, d, Math.floor(step / 16)); } catch (e) {}
      next += d; step++;
    }
  }
  return {
    // 换地方：换音乐
    setScene(id) {
      style = STYLES[id] || STYLES.plaza;
      step = 0;
      if (ac && enabled) { fade(0, 0.15); next = ac.currentTime + 0.25; setTimeout(() => fade(VOL, 0.8), 250); }
    },
    // 第一次点画面时调用（浏览器规定）
    unlock() { if (unlocked) return; unlocked = true; if (enabled && ensure()) { next = ac.currentTime + 0.05; fade(VOL, 1); } },
    toggle() {
      enabled = !enabled;
      try { localStorage.setItem('km_music', enabled ? 'on' : 'off'); } catch (e) {}
      if (enabled) { if (ensure()) { next = ac.currentTime + 0.05; fade(VOL, 0.6); } } else fade(0, 0.3);
      return enabled;
    },
    // 便利店门口的"叮咚"
    chime() {
      if (!ac || !enabled) return;
      const now = ac.currentTime + 0.05;
      tone(79, now, 0.25, 'sine', 0.18, 0.005, 0.5);
      tone(76, now + 0.3, 0.35, 'sine', 0.18, 0.005, 0.7);
    },
    get enabled() { return enabled; },
  };
})();

const areas = {};
function newArea(id, title, bounds) {
  const scene = new THREE.Scene();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ visible: false }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  return { id, title, scene, ground, bounds, doors: [], obstacles: [], people: [], hotspots: [], tick: [], seats: [], seatMeshes: [], walls: [], occluders: [] };
}

// ---------- 广场 ----------
function buildPlaza() {
  const A = newArea('plaza', t('plaza'), { minX: -13.6, maxX: 13.6, minZ: -10.6, maxZ: 11 });

  // 地砖（画布画格子）

  // 店铺
  VENUES.forEach((v) => {

    grp.add(box(w + 0.2, 0.25, d + 0.2, glowMat(new THREE.Color(v.color)), 0, h, 0)); // 屋顶霓虹边

    for (let i = -1; i <= 1; i += 2) {
      grp.add(box(1.6, 1.2, 0.05, new THREE.MeshBasicMaterial({ color: new THREE.Color(v.color).multiplyScalar(0.35), toneMapped: false }), i * 2.5, 2.2, d / 2 + 0.03));
    }
    // 门（发光）

    // 门前的地垫
    const mat = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4), new THREE.MeshBasicMaterial({ color: new THREE.Color(v.color), transparent: true, opacity: v.closed ? 0.15 : 0.45, toneMapped: false }));
    mat.rotation.x = -Math.PI / 2; mat.position.set(0, 0.03, d / 2 + 0.9);
    grp.add(mat);
    if (!v.closed) A.tick.push((time) => { mat.material.opacity = 0.3 + 0.2 * Math.sin(time * 3); });
    // 招牌的光照到地上
    const light = new THREE.PointLight(new THREE.Color(v.color), 1.6, 11, 2);
    light.position.set(0, 3, d / 2 + 2);

    // 放到广场的边上，面向广场中间

    } else {

    // 整栋房子（墙、屋顶、招牌、窗）挡住镜头时会一起变透明；门前地垫除外
    grp.traverse((m) => {
      if (!m.isMesh || m === mat) return;
      m.material.transparent = true;
      m.userData.baseOpacity = m.material.opacity;
      m.userData.building = grp;
      A.occluders.push(m);
    });
    v.plazaSpawn = spawn;
    A.doors.push({ x: doorPos.x, z: doorPos.z, r: 1.1, to: v.closed ? null : v.id, venue: v });

  });

  // 中间：发光的"CHILL CITY"柱子 + 花圃
  A.obstacles.push({ x: 0, z: -1, r: 2.1 });
  S.add(cyl(2, 2.1, 0.6, lambert(0x2d2a44), 0, 0.3, -1, 24));

  S.add(cyl(0.35, 0.45, 4.2, lambert(0x2d2a44), 0, 2.4, -1));
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.08, 8, 40), glowMat(0xff3cac));
  ring.position.set(0, 4.1, -1);
  S.add(ring);
  A.tick.push((time) => { ring.rotation.y = time * 0.8; ring.rotation.x = Math.sin(time) * 0.3; });
  const title = label('CHILL CITY', 1.0, { color: '#fff', glow: '#ff3cac', size: 80, pad: 30 });
  title.position.set(0, 5.4, -1);
  S.add(title);
  // 棕榈树
  const palm = (x, z) => {
    S.add(cyl(0.12, 0.18, 3, lambert(0x6b4a2b), x, 1.5, z, 8));
    for (let i = 0; i < 6; i++) {

      leaf.translateX(0.7);

    }
    A.obstacles.push({ x, z, r: 0.4 });
  };
  palm(-12.5, -9.5); palm(12.5, -9.5); palm(-12.5, 10.5); palm(12.5, 10.5);
  // 路灯
  const lamp = (x, z) => {
    S.add(cyl(0.07, 0.09, 3.4, lambert(0x333344), x, 1.7, z, 8));
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), glowMat(0xfff1c0));
    bulb.position.set(x, 3.5, z);
    S.add(bulb);
    A.obstacles.push({ x, z, r: 0.25 });
  };
  [-6, 6].forEach((x) => { lamp(x, -6.5); lamp(x, 4.2); });

  // 宵夜摊位（在广场下面）
  (SHOW_STALLS ? STALLS : []).forEach((s) => {
    const z = 9;
    S.add(box(3, 1, 1.2, lambert(0x8a5a3a), s.x, 0.5, z));
    S.add(box(3.3, 0.12, 1.8, glowMat(new THREE.Color(s.color).multiplyScalar(0.8)), s.x, 2.4, z - 0.1));
    [-1.4, 1.4].forEach((px) => S.add(cyl(0.05, 0.05, 1.9, lambert(0x555555), s.x + px, 1.45, z - 0.5, 6)));
    for (let i = 0; i < 6; i++) {
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), glowMat(0xffe9a8));
      bulb.position.set(s.x - 1.4 + i * 0.56, 2.25, z + 0.75);
      S.add(bulb);

    const sl = label(pick(s.name), 0.5, { color: '#fff', glow: s.color, size: 56, pad: 20 });

    A.obstacles.push({ x: s.x - 0.8, z, r: 0.9 }, { x: s.x + 0.8, z, r: 0.9 });
    A.hotspots.push({ x: s.x, z: z - 1.6 });
  });
  // ---- Lok Lok 车（大马夜生活必备！）车头朝 +z，打开的一边朝 +x ----
  {
    const tx = -10.4, tz = 1.2;
    const T = new THREE.Group();
    T.position.set(tx, 0, tz);
    T.add(box(2.0, 1.7, 3.4, lambert(0xf4f4f4), 0, 1.25, -0.3));       // 车厢
    T.add(box(2.02, 0.25, 3.42, lambert(0xffcf3c), 0, 0.55, -0.3));    // 黄色腰线
    T.add(box(1.9, 1.3, 1.2, lambert(0xd32f2f), 0, 1.05, 1.9));        // 车头
    T.add(box(1.7, 0.5, 0.05, new THREE.MeshBasicMaterial({ color: 0x223344 }), 0, 1.35, 2.51)); // 挡风玻璃
    [[-1.0, -1.3], [1.0, -1.3], [-1.0, 1.8], [1.0, 1.8]].forEach(([wx, wz]) => {
      const wh = cyl(0.35, 0.35, 0.22, lambert(0x111111), wx, 0.35, wz, 14);
      wh.rotation.z = Math.PI / 2;
      T.add(wh);
    });
    const awn = box(1.4, 0.08, 3.4, lambert(0xd32f2f), 1.55, 2.15, -0.3);  // 掀起来的侧板

    T.add(awn);
    for (let i = 0; i < 9; i++) {

    }
    T.add(box(0.55, 0.95, 3.2, lambert(0x8a5a3a), 1.25, 0.48, -0.3));    // 柜台
    // 一层一层的串串
    const cols = [0xe53935, 0xffffff, 0xff9800, 0x43a047, 0xfdd835, 0x8d6e63];
    for (let tier = 0; tier < 3; tier++) {
      T.add(box(0.12, 0.04, 2.4, lambert(0x666666), 1.0 + tier * 0.13, 0.98 + tier * 0.2, -0.85));
      for (let i = 0; i < 11; i++) {

      }

    const steam = [];

      st.m.position.set(1.2 + Math.sin(time + st.ph * 9) * 0.08, 1.35 + k * 1.0, 0.85 + Math.cos(time + st.ph * 7) * 0.08);

    [[-0.95, 0], [0.95, 0], [0, 0.95], [0, -0.95]].forEach(([dx, dz]) => makeSeat(A, 'plastic', 0x3b6be2, x + dx, z + dz, Math.atan2(-dx, -dz)));

    const h = A.hotspots[i % A.hotspots.length];
    p.position.set(h.x + (Math.random() - 0.5) * 3, 0, h.z + (Math.random() - 0.5) * 2);
    addNpc(A, p);
  }
  return A;
}

function buildInterior(v) {

  const addWall = (w, d, x, z, nx, nz) => {
    const m = box(w, H, d, new THREE.MeshLambertMaterial({ color: wallColor, transparent: true, opacity: 1 }), x, H / 2, z);

  addWall(W, 0.2, 0, -D / 2, 0, -1);

  addWall(0.2, D, W / 2, 0, 1, 0);
  const seg = (W - 3) / 2; // 前面的墙中间留门口
  addWall(seg, 0.2, -(1.5 + seg / 2), D / 2, 0, 1);
  addWall(seg, 0.2, 1.5 + seg / 2, D / 2, 0, 1);
  S.add(box(W, 0.15, 0.25, glowMat(col), 0, H, -D / 2 + 0.1)); // 墙顶霓虹线
  // 店名挂在后墙

  S.add(exitLabel);
  A.doors.push({ x: 0, z: 4.4, r: 0.9, to: 'plaza', spawn: v.plazaSpawn });

  const people = [];
  if (v.id === 'club') {
    // 会变色的舞池

      S.add(tm); tiles.push(tm);

    A.tick.push((time) => tiles.forEach((tm, k) => tm.material.color.setHSL(((time * 0.25 + k * 0.07) % 1), 0.9, 0.35 + 0.15 * Math.sin(time * 4 + k))));
    // 中间舞台 + DJ 台 + DJ
    S.add(box(5, 0.4, 2, lambert(0x2a1a40), 0, 0.2, -4.0));
    S.add(box(5.05, 0.06, 2.05, glowMat(0xff3cac), 0, 0.41, -4.0));
    S.add(box(3, 0.9, 0.7, lambert(0x222233), 0, 0.85, -3.4));
    S.add(box(3.05, 0.12, 0.75, glowMat(0x3ca8ff), 0, 1.32, -3.4));
    for (let i = 0; i < 8; i++) {
      const led = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 4), glowMat([0x7dff5a, 0xff3cac, 0xffe14d][i % 3]));
      led.position.set(-1.2 + i * 0.34, 1.42, -3.3);
      S.add(led);

function addNpc(A, p) {
  if (p.isNpc && !p.profile) p.profile = { bio: rndOf(NPC_BIOS[lang] || NPC_BIOS.en), langs: rndOf(NPC_LANGS) };
  if (!p.dance && !p.fixed && Math.random() < 0.45) setStatus(p, rndOf(NPC_STATUS));
  p.waitUntil = p.waitUntil || performance.now() / 1000 + Math.random() * 4;
  A.scene.add(p);
  A.people.push(p);
}

// ============================================================
// 6. 走路、碰撞、NPC
// ============================================================
function clampTo(A, x, z) {
  const b = A.bounds;
  return { x: Math.min(b.maxX, Math.max(b.minX, x)), z: Math.min(b.maxZ, Math.max(b.minZ, z)) };
}
function blockedAt(A, x, z) {
  return A.obstacles.some((o) => Math.hypot(x - o.x, z - o.z) < o.r + 0.3);
}
function pushOut(A, p) {
  A.obstacles.forEach((o) => {
    const dx = p.position.x - o.x, dz = p.position.z - o.z, d = Math.hypot(dx, dz), min = o.r + 0.3;
    if (d < min && d > 0.0001) { p.position.x = o.x + (dx / d) * min; p.position.z = o.z + (dz / d) * min; }
  });
}
// 坐下 / 站起来
function freeSeats(A) { return A.seats.filter((st) => !st.occupant); }
function sitDown(p, st) {
  p.seat = st; st.occupant = p;
  p.goSeat = null; p.target = null;
  if (st.kind === 'bed') {       // 躺下：整个人往后倒，脸朝上
    p.position.set(st.x, st.h + 0.17, st.z);
    p.rotation.set(-Math.PI / 2, 0, 0);
    if (p === player) toast(t('massage_start'));
  } else if (st.kind === 'recline') { // 脚底按摩躺椅：往后靠
    p.position.set(st.x, st.h - 0.42, st.z);
    p.rotation.set(-0.45, st.rot, 0);
    if (p === player) toast(t('foot_start'));
  } else {
    p.position.set(st.x, st.h - 0.47, st.z);
    p.rotation.set(0, st.rot, 0);
  }
  if (p.isNpc) p.sitUntil = performance.now() / 1000 + 8 + Math.random() * 16;
  if (p === player && me) netSit(st);
}
function standUp(p) {
  if (!p.seat) return;
  const st = p.seat;
  st.occupant = null; p.seat = null;
  if (p === player && me) netStand();
  if (st.kind === 'bed') { // 从床的左边下来
    p.rotation.set(0, -Math.PI / 2, 0);
    p.position.set(st.x - 0.95, 0, st.z - 0.9);
  } else {
    p.rotation.set(0, st.rot, 0);
    p.position.set(st.x + Math.sin(st.rot) * 0.7, 0, st.z + Math.cos(st.rot) * 0.7); // 往前站一步
  }
}

function stepPerson(A, p, dt, time) {
  if (p.fixed) return false; // 技师站在原地，动作另外做
  // 躺着：手脚放直
  if (p.seat && p.seat.kind === 'bed') {
    p.legL.rotation.x = p.legR.rotation.x = 0;
    p.armL.rotation.x = p.armR.rotation.x = 0;
    p.armL.rotation.z = p.armR.rotation.z = 0;
    return false;
  }
  // 坐着：脚向前、手放膝盖
  if (p.seat) {
    p.legL.rotation.x = p.legR.rotation.x = -1.45;
    p.armL.rotation.x = p.armR.rotation.x = -0.45;
    p.armL.rotation.z = p.armR.rotation.z = 0;
    return false;
  }
  let moving = false;
  if (p.target) {
    const dx = p.target.x - p.position.x, dz = p.target.z - p.position.z, d = Math.hypot(dx, dz);
    const step = p.speed * dt;
    if (d <= step || d < 0.05) {
      p.position.x = p.target.x; p.position.z = p.target.z; p.target = null;
      // 走到椅子了：没人坐就坐下
      if (p.goSeat) {
        if (!p.goSeat.occupant) sitDown(p, p.goSeat);
        else { p.goSeat = null; if (p === player) toast(t('seat_taken')); }
        if (p.seat) return false;
      }
    } else {
      // 绕路：正前方被挡住，就试试斜一点的方向
      const ignore = p.goSeat && d < 1.6;
      let ang = Math.atan2(dx, dz);
      if (!ignore) {
        for (const off of (p.detour ? [0, p.detour, 0.5, -0.5, 1.0, -1.0, 1.5, -1.5, 2.1, -2.1, 2.7, -2.7] : [0, 0.5, -0.5, 1.0, -1.0, 1.5, -1.5, 2.1, -2.1, 2.7, -2.7])) {
          const nx = p.position.x + Math.sin(ang + off) * step * 4, nz = p.position.z + Math.cos(ang + off) * step * 4;
          if (!blockedAt(A, nx, nz)) { ang += off; p.detour = off ? Math.sign(off) * Math.min(Math.abs(off), 1.5) : 0; break; }
        }
      }
      p.position.x += Math.sin(ang) * step; p.position.z += Math.cos(ang) * step;
      const want = ang;
      let diff = want - p.rotation.y;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      p.rotation.y += diff * Math.min(1, dt * 12);
      moving = true;
      // 快到椅子时不检查障碍物，不然有些椅子（吧台前）会走不到
      if (!(p.goSeat && d < 1.6)) {
        const before = p.position.clone();
        pushOut(A, p);
        if (before.distanceTo(p.position) > step * 0.9 && p.isNpc) { p.target = null; p.goSeat = null; } // NPC 撞到东西就换方向
      }
    }
  }
  // 动作：走路摆手脚 / 跳舞 / 站着
  const sw = moving ? Math.sin(time * p.speed * 4 + p.phase) * 0.7 : 0;
  if (p.dance) {
    const k = Math.sin(time * 8 + p.phase), by = p.baseY || 0;
    if (p.wave === undefined) p.wave = false;
    p.legL.rotation.x = p.legR.rotation.x = 0;
    p.armL.rotation.x = p.armR.rotation.x = 0;
    p.armL.rotation.z = p.armR.rotation.z = 0;
    if (p.dance === 'sway') {            // 派对舞者：扭腰、举手
      const w = Math.sin(time * 3.4 + p.phase);
      p.rotation.y = p.baseRot + w * 0.4;
      p.position.y = by + Math.abs(Math.sin(time * 3.4 + p.phase)) * 0.07;
      p.armL.rotation.z = 2.4 + w * 0.4; p.armR.rotation.z = -0.6 - w * 0.4;
      p.legL.rotation.x = w * 0.15; p.legR.rotation.x = -w * 0.15;
    } else if (p.dance === 'nod') {      // 对着音响点头
      p.rotation.y = p.baseRot;

}

function watchFps(now) {
  if (now - bootAt < 8 || document.visibilityState !== 'visible') { fpsT = 0; return; } // 刚打开的几秒在准备场景，不算
  fpsN++;

      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.8));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

const npcPhotoCache = {};
function npcPhotos(name) {
  if (npcPhotoCache[name]) return npcPhotoCache[name];
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const themes = [
    ['#ff9a5a', '#5a2a6a', '🌅'], ['#2a2a5a', '#0a0a1a', '🌃'], ['#ffd27a', '#c0603a', '🍜'],
    ['#7ad0ff', '#2a6aa0', '🏖️'], ['#c8f0c8', '#3a8a5a', '🐱'], ['#f0c8e8', '#8a3a7a', '☕'], ['#ffcf3c', '#a0401a', '🍢'],
  ];
  const n = 2 + (h % 4); // 2–5 张
  const list = [];
  for (let i = 0; i < n; i++) {
    const [a, b, emo] = themes[(h + i * 3) % themes.length];
    const c = document.createElement('canvas'); c.width = c.height = 240;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, 240); grd.addColorStop(0, a); grd.addColorStop(1, b);
    g.fillStyle = grd; g.fillRect(0, 0, 240, 240);
    g.font = '110px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emo, 120, 125);
    list.push(c.toDataURL('image/jpeg', 0.8));
  }
  return (npcPhotoCache[name] = list);
}

function dataUrlToBlob(url) {
  const [head, b64] = url.split(',');
  const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function cleanChat(text, max) {
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  if (!s) return { ok: false, reason: '' };
  if (/(\d[\s-]?){6,}/.test(s)) return { ok: false, reason: 'status_no_phone' };
  if (/(https?:\/\/|www\.|\.com\b|\.my\b|wa\.me|t\.me)/i.test(s)) return { ok: false, reason: 'status_no_link' };
  return { ok: true, text: Array.from(s).slice(0, max).join('') };
}

// ============================================================
// 多人同步：每个地方一个"房间"，每条线最多 LINE_MAX 人
// ============================================================
let room = null, roomLine = 1, lastTrack = 0;
const remotes = new Map(); // 别人的 id → 小人
function myPresence() {
  return {
    name: myName, look: me.profile.look || {}, gender: me.profile.gender || '', status: myProfile.status || '',
    x: +(player.target ? player.target.x : player.position.x).toFixed(2),

}
function trackMe(force) {
  if (!room || !me) return;
  const now = Date.now();
  if (!force && now - lastTrack < 800) return;
  lastTrack = now;
  room.track(myPresence());
}
let trailTimer = 0;
function showPlace() {
  if (!room) { document.getElementById('place').textContent = area.title; return; }
  const n = Object.keys(room.presenceState()).length || 1;
  document.getElementById('place').textContent = area.title + ' · ' + t('line').replace('{n}', roomLine) + ' · 👥 ' + n;
}
function reportWhere(gone) {

}

function placeName(id) { const v = VENUES.find((x) => x.id === id); return v ? pick(v.name) : t('go_plaza').replace(/^\S+\s/, ''); }
let pendingLine = 0;

function openLinePicker() {

function sendRoom(event, payload) {
  if (room && me) room.send({ type: 'broadcast', event, payload: Object.assign({ id: me.id }, payload) });
}
function leaveRoom() {
  if (room && sb) sb.removeChannel(room);
  room = null;
  remotes.forEach((p) => removeRemote(p));
  remotes.clear();
}
function removeRemote(p) {
  if (p.seat) standUp(p);
  if (p.parent) p.parent.remove(p);
  const A = p.homeArea || area; // 小人原本在的地方（换地方后 area 已经变了）
  if (A) A.people = A.people.filter((x) => x !== p);
}
function upsertRemote(id, meta) {
  if (id === me.id || blockedIds.has(id)) return;
  let p = remotes.get(id);
  if (!p) {
    p = makePerson(Object.assign({ skin: SKIN[0], shirt: CLOTHES[1], pants: PANTS[0], hair: HAIR[0] }, meta.look || {}, { name: meta.name || '?', isNpc: false, speed: 3.5 }));
    p.userId = id; p.remote = true; p.homeArea = area;
    p.position.set(meta.x || 0, 0, meta.z || 0);
    area.scene.add(p);
    area.people.push(p);
    remotes.set(id, p);
  } else if (!p.target && !p.seat && Math.hypot(p.position.x - meta.x, p.position.z - meta.z) > 0.5) {
    p.target = clampTo(area, meta.x, meta.z);
  }
  p.gender = meta.gender || (meta.look && meta.look.gender) || '';
  if ((meta.status || '') !== (p.status || '')) setStatus(p, meta.status);
  const want = meta.seat >= 0 ? area.seats[meta.seat] : null;
  if (want && p.seat !== want) remoteSit(p, want);
  if (!want && p.seat) standUp(p);
}
function remoteSit(p, st) {
  if (!st) return;
  if (st.occupant && st.occupant !== p) { if (st.occupant === player) return; standUp(st.occupant); }
  if (p.seat) standUp(p);
  sitDown(p, st);
}
const MAX_LINES = 20;
async function joinRoom(areaId, wantLine) {
  leaveRoom();
  if (!me || !sb) return;
  const order = [];
  if (wantLine) order.push(wantLine);
  for (let n = 1; n <= MAX_LINES; n++) if (n !== wantLine) order.push(n);
  for (const line of order) {
    const ch = sb.channel('room:' + areaId + ':' + line, { config: { presence: { key: me.id }, broadcast: { self: false } } });
    let synced = false;
    ch.on('presence', { event: 'sync' }, () => {
      synced = true;
      if (room !== ch) return;
      const state = ch.presenceState();
      const ids = new Set(Object.keys(state));
      Object.entries(state).forEach(([id, metas]) => { if (metas && metas[0]) upsertRemote(id, metas[0]); });
      remotes.forEach((p, id) => { if (!ids.has(id)) { removeRemote(p); remotes.delete(id); } });
      showPlace();
    });
    ch.on('broadcast', { event: 'move' }, ({ payload }) => {
      const p = room === ch && remotes.get(payload.id);
      if (!p) return;
      if (p.seat) standUp(p);
      p.target = clampTo(area, payload.x, payload.z);
    });
    ch.on('broadcast', { event: 'say' }, ({ payload }) => { const p = room === ch && remotes.get(payload.id); if (p) say(p, String(payload.text || '').slice(0, 100)); });
    ch.on('broadcast', { event: 'sit' }, ({ payload }) => { const p = room === ch && remotes.get(payload.id); if (p) remoteSit(p, area.seats[payload.seat]); });
    ch.on('broadcast', { event: 'stand' }, ({ payload }) => { const p = room === ch && remotes.get(payload.id); if (p && p.seat) standUp(p); });
    ch.on('broadcast', { event: 'status' }, ({ payload }) => { const p = room === ch && remotes.get(payload.id); if (p) setStatus(p, String(payload.status || '').slice(0, 20)); });
    const ok = await new Promise((res) => {
      ch.subscribe((status) => { if (status === 'SUBSCRIBED') res(true); else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') res(false); });
      setTimeout(() => res(false), 8000);
    });
    if (!ok) { sb.removeChannel(ch); toast(t('net_fail')); return; }
    // 等一下拿到房间里现在有谁
    for (let i = 0; i < 20 && !synced; i++) await new Promise((r) => setTimeout(r, 100));
    const count = Object.keys(ch.presenceState()).filter((id) => id !== me.id).length;
    if (count >= LINE_MAX) { sb.removeChannel(ch); if (line === wantLine) toast(t('line_full').replace('{n}', line)); continue; }
    if (area.id !== areaId) { sb.removeChannel(ch); return; } // 等的时候已经换地方了
    room = ch; roomLine = line;
    await ch.track(myPresence());
    // 手动跑一次同步，把已经在的人画出来
    Object.entries(ch.presenceState()).forEach(([id, metas]) => { if (metas && metas[0]) upsertRemote(id, metas[0]); });
    showPlace();
    reportWhere();
    return;
  }
  toast(t('all_full'));
}

  top.appendChild(info); card.appendChild(top);
  const list = el('div', 'msgs'); card.appendChild(list);
  const add = (m) => list.appendChild(el('div', 'msg ' + (m.sender === me.id ? 'me' : 'them'), m.body));
  const { data } = await sb.from('messages').select('*')
    .or('and(sender.eq.' + me.id + ',recipient.eq.' + uid + '),and(sender.eq.' + uid + ',recipient.eq.' + me.id + ')')
    .order('created_at', { ascending: true }).limit(100);
  if (!data || !data.length) list.appendChild(el('div', 'card-note', t('say_something')));
  (data || []).forEach(add);
  list.scrollTop = list.scrollHeight;
  await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('sender', uid).eq('recipient', me.id).is('read_at', null);
  unreadBy[uid] = 0; updateFriendBadge();
  openChatWith = { uid, add: (m) => { add(m); list.scrollTop = list.scrollHeight; } };
  const row = el('div', 'card-row');
  const inp = el('input', 'field'); inp.placeholder = t('type_msg'); inp.maxLength = 500; inp.style.flex = '3';
  const send = el('button', 'btn', t('send'));
  const doSend = async () => {
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    const { data: row1, error } = await sb.from('messages').insert({ recipient: uid, body: text }).select().single();
    if (error) { toast(t('net_fail')); return; }
    openChatWith && openChatWith.add(row1);
  };
  send.onclick = doSend;
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSend(); });
  row.appendChild(inp); row.appendChild(send); card.appendChild(row);
  const bottom = el('div', 'card-row');
  const back = el('button', 'btn dark', t('friends_list')); back.onclick = openFriends; bottom.appendChild(back);
  card.appendChild(bottom);
  inp.focus();
}

// ---------- 即时收到：新消息、好友邀请 ----------
function subscribeInbox() {
  sb.channel('inbox:' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'recipient=eq.' + me.id }, async ({ new: m }) => {
      if (blockedIds.has(m.sender)) return;
      if (openChatWith && openChatWith.uid === m.sender && document.getElementById('modal')) {
        openChatWith.add(m);
        sb.from('messages').update({ read_at: new Date().toISOString() }).eq('id', m.id).then(() => {});
      } else {
        unreadBy[m.sender] = (unreadBy[m.sender] || 0) + 1;
        updateFriendBadge();
        await fetchProfiles([m.sender]);
        toast('💬 ' + ((profileCache.get(m.sender) || {}).name || '') + '：' + String(m.body).slice(0, 30));
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, async ({ eventType, new: f }) => {
      await loadFriends();
      if (eventType === 'INSERT' && f && f.addressee === me.id) {
        toast('👋 ' + ((profileCache.get(f.requester) || {}).name || '') + ' ' + t('wants_friend'));
      }
    })
    .subscribe();
}

// ============================================================
// 我的资料：上传头像、生活照、保存（离线时存在这台机）
// ============================================================
async function changeAvatar(url) {
  if (!me) { myProfile.avatar = url; if (saveProfile()) openCard(player); return; }
  const path = me.id + '/avatar-' + Date.now() + '.jpg';
  const { error } = await sb.storage.from('avatars').upload(path, dataUrlToBlob(url), { contentType: 'image/jpeg' });
  if (error) { toast(t('net_fail')); return; }
  const old = me.profile.avatar_path;
  await sb.from('profiles').update({ avatar_path: path }).eq('id', me.id);
  if (old) sb.storage.from('avatars').remove([old]).then(() => {});
  me.profile.avatar_path = path;
  myProfile.avatar = avatarUrl(path);
  openCard(player);
}
async function addPhoto(url) {
  if (!me) { myProfile.photos.push(url); if (saveProfile()) openCard(player); else myProfile.photos.pop(); return; }
  const paths = (me.profile.photo_paths || []).slice();
  if (paths.length >= 5) return;
  const path = me.id + '/' + Date.now() + '.jpg';
  const { error } = await sb.storage.from('life-photos').upload(path, dataUrlToBlob(url), { contentType: 'image/jpeg' });
  if (error) { toast(t('net_fail')); return; }
  paths.push(path);
  await sb.from('profiles').update({ photo_paths: paths }).eq('id', me.id);
  me.profile.photo_paths = paths;
  myProfile.photos = await signedPhotos(paths);
  openCard(player);
}
async function deletePhoto(i) {
  if (!me) { myProfile.photos.splice(i, 1); saveProfile(); openCard(player); return; }
  const paths = (me.profile.photo_paths || []).slice();
  const [gone] = paths.splice(i, 1);
  await sb.from('profiles').update({ photo_paths: paths }).eq('id', me.id);
  if (gone) sb.storage.from('life-photos').remove([gone]).then(() => {});
  me.profile.photo_paths = paths;
  myProfile.photos = await signedPhotos(paths);
  openCard(player);
}
async function saveMyProfile() {
  if (!me) { if (saveProfile()) { closeModal(); toast('✅'); } return; }
  const { error } = await sb.from('profiles').update({ bio: myProfile.bio.slice(0, 120), langs: myProfile.langs.slice(0, 40) }).eq('id', me.id);
  const { error: e2 } = await sb.from('profile_private').upsert({ id: me.id, contact: myProfile.contact.slice(0, 60) });
  closeModal();
  toast(error || e2 ? t('net_fail') : '✅');
}

// ---------- 好友名单（真人部分，放在 NPC 好友上面）----------
function renderOnlineFriends(card, where) {
  if (!me) return;
  const others = (r) => (r.requester === me.id ? r.addressee : r.requester);
  const incoming = friendRows.filter((r) => r.status === 'pending' && r.addressee === me.id);
  const real = friendRows.filter((r) => r.status === 'accepted');
  if (incoming.length) {
    card.appendChild(el('div', 'card-label', '👋 ' + t('friend_requests')));
    incoming.forEach((r) => {
      const uid = others(r), prof = profileCache.get(uid) || { name: '?' };
      const row = el('div', 'friend-row');
      const av = el('img', 'avatar tiny'); av.alt = ''; av.src = avatarUrl(prof.avatar_path) || portrait(prof.look || {});
      row.appendChild(av);
      const mid = el('div', 'friend-mid'); mid.appendChild(el('div', 'friend-name', prof.name)); row.appendChild(mid);
      const ok = el('button', 'btn', t('accept')); ok.style.background = '#2ecc71'; ok.style.flex = 'none';
      ok.onclick = async (e) => { e.stopPropagation(); ok.disabled = true; await acceptFriend(uid); openFriends(); };
      const no = el('button', 'btn', '✕'); no.style.background = '#b2bec3'; no.style.flex = 'none';
      no.onclick = async (e) => { e.stopPropagation(); await removeFriend(uid); openFriends(); };
      row.appendChild(ok); row.appendChild(no);
      card.appendChild(row);
    });
  }
  card.appendChild(el('div', 'card-label', '🙂 ' + t('real_friends')));
  if (!real.length) card.appendChild(el('div', 'card-note', t('no_real_friends')));
  real.forEach((r) => {
    const uid = others(r), prof = profileCache.get(uid) || { name: '?' };
    const row = el('div', 'friend-row');
    const av = el('img', 'avatar tiny'); av.alt = ''; av.src = avatarUrl(prof.avatar_path) || portrait(prof.look || {});
    row.appendChild(av);
    const mid = el('div', 'friend-mid'); mid.appendChild(el('div', 'friend-name', prof.name));
    mid.appendChild(el('div', 'friend-last', prof.status || ''));
    const w = where && where[uid];
    const on = w && w.area && w.seen_at && Date.now() - new Date(w.seen_at).getTime() < 150000;
    mid.appendChild(el('div', 'where', on ? '📍 ' + placeName(w.area) + ' · ' + t('line').replace('{n}', w.line) : '⚪ ' + t('offline_now')));
    row.appendChild(mid);
    if (on) {
      const go = el('button', 'btn', t('find_friend')); go.style.background = '#2e86de'; go.style.flex = 'none'; go.style.fontSize = '13px';
      go.onclick = (e) => { e.stopPropagation(); goToFriend(w.area, w.line); };
      row.appendChild(go);
    }
    if (unreadBy[uid]) row.appendChild(el('div', 'unread', String(unreadBy[uid])));
    row.onclick = () => openOnlineChat(uid);
    card.appendChild(row);
  });
  card.appendChild(el('div', 'card-label', '🤖 ' + t('npc_friends')));
}
function onlineBadgeCount() {
  if (!me) return 0;
  const inc = friendRows.filter((r) => r.status === 'pending' && r.addressee === me.id).length;
  return inc + Object.values(unreadBy).reduce((a, n) => a + (n || 0), 0);
}

let myName = 'Eddie';
document.getElementById('friendsBtn').onclick = () => { Music.unlock(); openFriends(); };
updateFriendBadge();
setStatus(player, myProfile.status);
document.getElementById('statusBtn').onclick = () => { Music.unlock(); openStatusEditor(); };

// ============================================================
// 9. 开始
// ============================================================
renderLangs();
document.getElementById('hint').textContent = t('hint');
// 🗺️ 地图：一按就到想去的地方
const mapPanel = document.getElementById('mapPanel');
function renderMap() {
  mapPanel.innerHTML = '';
  [{ id: 'plaza', label: t('go_plaza') }].concat(VENUES.map((v) => ({ id: v.id, label: pick(v.name) + (v.closed ? ' · ' + t('soon') : ''), closed: v.closed })))
    .forEach((it) => {
      const b = document.createElement('button');
      b.textContent = it.label;
      b.disabled = !!it.closed || (area && area.id === it.id);
      b.onclick = () => {
        mapPanel.style.display = 'none';
        getArea('plaza'); // 先盖广场，店里的出口才知道回去哪里
        const v = VENUES.find((x) => x.id === it.id);
        fadeTo(it.id, it.id === 'plaza' ? null : null);
      };
      mapPanel.appendChild(b);
    });
}
document.getElementById('mapBtn').onclick = () => {
  Music.unlock();
  const open = mapPanel.style.display === 'flex';
  if (!open) renderMap();
  mapPanel.style.display = open ? 'none' : 'flex';
};
// 链接后面加 #ktv 这类名字时，直接进那间店

if (VENUES.some((v) => v.id === startAt && !v.closed)) { getArea('plaza'); goTo(startAt); } else goTo('plaza');
// 附近聊天
const chatBar = document.getElementById('chatBar'), chatIn = document.getElementById('chatIn');
chatIn.placeholder = t('chat_ph');
const lineBtn = document.getElementById('lineBtn');
lineBtn.textContent = t('switch_line');
lineBtn.onclick = () => { Music.unlock(); if (room) openLinePicker(); };
document.getElementById('chatSend').textContent = t('send');
chatBar.addEventListener('submit', (e) => { e.preventDefault(); Music.unlock(); if (sendNearby(chatIn.value)) chatIn.value = ''; });
chatBar.addEventListener('pointerdown', (e) => e.stopPropagation());
function showOnlineUi(on) { document.body.classList.toggle('online', !!on); chatBar.style.display = on ? 'flex' : 'none'; }
if (sb) {
  sb.auth.getSession().then(({ data }) => {
    if (data && data.session) afterLogin(data.session.user).catch(() => toast(t('net_fail')));
    else showAuth('login');
  }).catch(() => toast(t('net_fail')));
}
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime, now = performance.now() / 1000;
  if (stepPerson(area, player, dt, time)) checkDoors();
  else if (!player.target) marker.visible = false;
  cullPeople(now);
  area.people.forEach((p) => { if (!p.parked) { thinkNpc(area, p, now); stepPerson(area, p, dt, time); } });
  area.tick.forEach((f) => f(time));
  watchFps(now);
  marker.rotation.z += dt * 2;
  updateNames();
  followCamera(dt);
  fadeWalls(dt);
  fadeOccluders(dt);
  renderer.render(area.scene, camera);
  requestAnimationFrame(loop);
}
loop();
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chill City · Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #15122a; color: #eee; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #1f1a3d; border-bottom: 1px solid #332c5c; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: #3b3355; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button.on { background: #6c5ce7; }
  .card { background: #fff8ee; color: #222; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .av { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #ddd; flex: none; }
  .name { font-weight: 700; font-size: 17px; }
  .muted { color: #777; font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #eee; margin-right: 4px; }
  .tag.open { background: #ffeaa7; } .tag.reviewed { background: #dfe6e9; } .tag.actioned { background: #fab1a0; } .tag.banned { background: #d63031; color: #fff; }
  .reason { font-weight: 700; color: #d63031; }
  .photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .photos img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; cursor: zoom-in; }
  .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .ok { background: #00b894; } .ban { background: #d63031; } .grey { background: #b2bec3; color: #222; }
  .login { max-width: 340px; margin: 60px auto; background: #fff8ee; color: #222; border-radius: 12px; padding: 20px; }
  .login input { width: 100%; font-size: 16px; padding: 10px; margin: 6px 0; border: 2px solid #ccc; border-radius: 8px; }
  .err { color: #d63031; min-height: 20px; margin-top: 6px; }
  .empty { text-align: center; color: #aaa; padding: 40px 0; }
  #big { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 9; }
  #big img { max-width: 94vw; max-height: 90vh; }
</style>
</head>
<body>
<header><h1>🌃 Chill City · Admin</h1><span id="who" class="muted"></span><button id="out" class="grey" style="display:none">Log out</button></header>
<main id="main"></main>
<div id="big"><img alt=""></div>
<script>
{
const sb = supabase.createClient('https://vvyjwdvdpmnfgrcwspyk.supabase.co', 'sb_publishable_pc9FPBdb3veOEnXd2d4Q7A_zdbGrY_L');
const main = document.getElementById('main');
const REASONS = { r_harass: 'Harassment', r_photo: 'Inappropriate photo', r_scam: 'Scam / spam', r_fake: 'Impersonation', r_minor: 'May be under 18', r_other: 'Other' };
const STATUS = { open: 'Open', reviewed: 'Reviewed', actioned: 'Banned' };
let tab = 'open';
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const when = (s) => new Date(s).toLocaleString('en-MY', { dateStyle: 'medium', timeStyle: 'short' });
const avatar = (path) => path ? sb.storage.from('avatars').getPublicUrl(path).data.publicUrl : '';
const big = document.getElementById('big');
big.onclick = () => { big.style.display = 'none'; };

function showLogin(msg) {
  main.innerHTML = '';
  const box = h('div', 'login');
  box.appendChild(h('div', 'name', 'Admin login'));
  const em = h('input'); em.type = 'email'; em.placeholder = 'Email'; em.autocomplete = 'email';
  const pw = h('input'); pw.type = 'password'; pw.placeholder = 'Password'; pw.autocomplete = 'current-password';
  const err = h('div', 'err', msg || '');
  const go = h('button', 'ok', 'Log in'); go.style.width = '100%';
  go.onclick = async () => {
    go.disabled = true; err.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    go.disabled = false;
    if (error) { err.textContent = error.message; return; }
    start();
  };
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go.click(); });
  box.append(em, pw, go, err);
  main.appendChild(box);
}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: adm } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  document.getElementById('who').textContent = session.user.email;
  const out = document.getElementById('out'); out.style.display = 'inline-block';
  out.onclick = async () => { await sb.auth.signOut(); location.reload(); };
  if (!adm) { main.innerHTML = ''; main.appendChild(h('div', 'empty', 'This account is not an admin.')); return; }
  render();
}

async function render() {
  main.innerHTML = '';
  const tabs = h('div', 'tabs');
  [['open', '📥 Open reports'], ['all', '📋 All reports'], ['bans', '🚫 Banned users']].forEach(([k, l]) => {
    const b = h('button', k === tab ? 'on' : '', l); b.onclick = () => { tab = k; render(); }; tabs.appendChild(b);
  });
  const reload = h('button', 'grey', '🔄'); reload.onclick = render; tabs.appendChild(reload);
  main.appendChild(tabs);
  const list = h('div'); main.appendChild(list);
  list.appendChild(h('div', 'empty', 'Loading…'));
  if (tab === 'bans') return renderBans(list);

  let q = sb.from('reports').select('*').order('created_at', { ascending: false }).limit(100);
  if (tab === 'open') q = q.eq('status', 'open');
  const { data: reps, error } = await q;
  list.innerHTML = '';
  if (error) { list.appendChild(h('div', 'empty', error.message)); return; }
  if (!reps.length) { list.appendChild(h('div', 'empty', tab === 'open' ? 'No open reports 🎉' : 'No reports yet')); return; }
  const ids = [...new Set(reps.flatMap((r) => [r.reporter, r.reported]))];
  const [{ data: profs }, { data: privs }, { data: bans }, { data: counts }] = await Promise.all([
    sb.from('profiles').select('id,name,gender,status,bio,langs,avatar_path,photo_paths,created_at').in('id', ids),
    sb.from('profile_private').select('id,contact').in('id', ids),
    sb.from('bans').select('user_id').in('user_id', ids),
    sb.from('reports').select('reported').in('reported', ids),
  ]);
  const P = Object.fromEntries((profs || []).map((p) => [p.id, p]));
  const C = Object.fromEntries((privs || []).map((p) => [p.id, p.contact]));
  const banned = new Set((bans || []).map((b) => b.user_id));
  const timesReported = {}; (counts || []).forEach((r) => { timesReported[r.reported] = (timesReported[r.reported] || 0) + 1; });
  for (const r of reps) list.appendChild(await reportCard(r, P, C, banned, timesReported));
}

async function reportCard(r, P, C, banned, timesReported) {
  const who = P[r.reported] || { name: '(deleted user)' }, by = P[r.reporter] || { name: '?' };
  const card = h('div', 'card');
  const top = h('div', 'muted');
  top.append(h('span', 'tag ' + r.status, STATUS[r.status] || r.status), document.createTextNode(when(r.created_at) + ' · reported by ' + by.name));
  card.appendChild(top);
  const row = h('div', 'row'); row.style.marginTop = '10px';
  const av = h('img', 'av'); av.alt = ''; if (who.avatar_path) av.src = avatar(who.avatar_path); row.appendChild(av);
  const info = h('div');
  const nm = h('div', 'name', who.name + (who.gender === 'm' ? ' ♂' : who.gender === 'f' ? ' ♀' : ''));
  if (banned.has(r.reported)) nm.appendChild(h('span', 'tag banned', ' BANNED'));
  info.appendChild(nm);
  info.appendChild(h('div', 'reason', REASONS[r.reason] || r.reason));
  if (r.details) info.appendChild(h('div', '', '“' + r.details + '”'));
  info.appendChild(h('div', 'muted', 'Times reported: ' + (timesReported[r.reported] || 1) + (who.created_at ? ' · Joined ' + when(who.created_at) : '')));
  if (who.status) info.appendChild(h('div', 'muted', 'Status: ' + who.status));
  if (who.bio) info.appendChild(h('div', 'muted', 'Bio: ' + who.bio));
  if (C[r.reported]) info.appendChild(h('div', 'muted', 'Contact: ' + C[r.reported]));
  row.appendChild(info);
  card.appendChild(row);
  if (who.photo_paths && who.photo_paths.length) {
    const { data } = await sb.storage.from('life-photos').createSignedUrls(who.photo_paths, 3600);
    const ph = h('div', 'photos');
    (data || []).forEach((d) => { if (!d.signedUrl) return; const im = h('img'); im.src = d.signedUrl; im.alt = ''; im.onclick = () => { big.firstElementChild.src = d.signedUrl; big.style.display = 'flex'; }; ph.appendChild(im); });
    card.appendChild(ph);
  }
  const acts = h('div', 'acts');
  if (r.status === 'open') {
    const ok = h('button', 'ok', '✅ Mark as reviewed');
    ok.onclick = async () => { ok.disabled = true; await sb.from('reports').update({ status: 'reviewed' }).eq('id', r.id); render(); };
    acts.appendChild(ok);
  }
  if (!banned.has(r.reported) && P[r.reported]) {
    const ban = h('button', 'ban', '🚫 Ban user');
    ban.onclick = async () => {
      const why = prompt('Ban reason (only admins can see this):', REASONS[r.reason] || '');
      if (why === null) return;
      if (!confirm('Ban ' + who.name + '? They will be logged out and locked out immediately.')) return;
      ban.disabled = true;
      const { error } = await sb.rpc('admin_ban', { target: r.reported, why });
      if (error) { alert(error.message); ban.disabled = false; return; }
      await sb.from('reports').update({ status: 'actioned' }).eq('reported', r.reported).eq('status', 'open');
      render();
    };
    acts.appendChild(ban);
  }
  card.appendChild(acts);
  return card;
}

async function renderBans(list) {
  const { data: bans, error } = await sb.from('bans').select('*').order('created_at', { ascending: false });
  list.innerHTML = '';
  if (error) { list.appendChild(h('div', 'empty', error.message)); return; }
  if (!bans.length) { list.appendChild(h('div', 'empty', 'No banned users')); return; }
  const { data: profs } = await sb.from('profiles').select('id,name,avatar_path').in('id', bans.map((b) => b.user_id));
  const P = Object.fromEntries((profs || []).map((p) => [p.id, p]));
  bans.forEach((b) => {
    const p = P[b.user_id] || { name: '?' };
    const card = h('div', 'card');
    const row = h('div', 'row');
    const av = h('img', 'av'); av.alt = ''; if (p.avatar_path) av.src = avatar(p.avatar_path); row.appendChild(av);
    const info = h('div');
    info.appendChild(h('div', 'name', p.name));
    info.appendChild(h('div', 'muted', when(b.created_at) + (b.reason ? ' · ' + b.reason : '')));
    row.appendChild(info); card.appendChild(row);
    const acts = h('div', 'acts');
    const un = h('button', 'grey', '↩️ Unban');
    un.onclick = async () => {
      if (!confirm('Unban ' + p.name + '? They will be able to log in again.')) return;
      un.disabled = true;
      const { error } = await sb.rpc('admin_unban', { target: b.user_id });
      if (error) { alert(error.message); un.disabled = false; return; }
      render();
    };
    acts.appendChild(un); card.appendChild(acts);
    list.appendChild(card);
  });
}

start();
}
</script>
</body>
</html>
